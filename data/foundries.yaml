# FontFind foundry database
#
# One entry per foundry. Fields a human maintains (everything except `auto`):
#
#   pricing_metric  company_size | mixed | seats | traffic | unknown
#                   What the price scales with. `company_size` means headcount of
#                   the licensee is the (main) metric for every usage; `mixed`
#                   means company size for some usages, seats/traffic for others.
#   logo            included            logo/wordmark use is in the standard license
#                   included_small_only included only below some company size
#                   separate_size_based extra logo license, priced by company size
#                   separate            extra logo license, other pricing
#                   restricted          logo use limited / not allowed
#                   unknown
#   all_media       yes | partial | no | unknown
#                   Does one license cover desktop/print, web, app, social, video?
#   qualifies       yes      company size pricing + logo included + all media
#                   likely   looks like a match but one point is unconfirmed
#                   partial  company size pricing, but logo or some media is extra
#                   no       not priced by company size
#                   unknown  not enough information yet
#   verified        date + method. `search-snippet` means checked through web
#                   search results quoting the foundry's own pages, NOT a full
#                   read of the license text. Always read the EULA before buying.
#
# `auto` is written by `python -m fontfind scrape` and is overwritten on every run.

foundries:
